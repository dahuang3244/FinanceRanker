# Build the desktop app and a Windows installer.
#
# Why CI: PyInstaller cannot cross-compile. A macOS machine cannot produce a
# Windows .exe, and vice versa, so each platform's artifact must be built on that
# platform. This workflow does the Windows build (and its Inno Setup installer)
# on a windows-latest runner, and optionally the macOS build.
#
# Artifacts produced:
#   FinanceRanker-windows   dist/FinanceRanker/**        portable folder build
#   FinanceRanker-setup     dist/*-setup.exe             Windows installer
#   FinanceRanker-macos     dist/FinanceRanker.app       macOS app bundle

name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        env:
          PYTHONPATH: .
        run: |
          python tests/test_engine.py
          python tests/test_preview.py
          python tests/test_sectors.py
          python tests/test_scale.py
          python tests/test_health.py

      - name: Stage the bundled browser
        shell: pwsh
        run: |
          # Ship our own Chromium so the app depends on nothing the target
          # machine may or may not have -- and, just as importantly, so it never
          # touches pythonnet, whose Python.Runtime.dll cannot be loaded from a
          # frozen bundle. Chrome for Testing is Google's official portable
          # build and is addressable through a stable JSON index.
          $ProgressPreference = "SilentlyContinue"
          $meta = Invoke-RestMethod "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          $stable = $meta.channels.Stable
          $url = ($stable.downloads.chrome | Where-Object { $_.platform -eq "win64" }).url
          if (-not $url) { throw "could not resolve a win64 Chrome for Testing URL" }
          Write-Host "Chrome for Testing $($stable.version)"
          Write-Host "downloading $url"

          $zip = Join-Path $env:RUNNER_TEMP "chrome-win64.zip"
          # curl.exe rather than Invoke-WebRequest: this is ~200 MB and IWR's
          # progress rendering makes it several times slower.
          curl.exe -L --fail --retry 3 -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "browser download failed (curl exit $LASTEXITCODE)" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force

          New-Item -ItemType Directory -Force -Path "vendor\chromium" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\chrome-win64\*" "vendor\chromium\" -Recurse -Force

          if (-not (Test-Path "vendor\chromium\chrome.exe")) { throw "chrome.exe was not staged" }
          $mb = (Get-ChildItem "vendor\chromium" -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          Write-Host ("staged Chromium: {0:N1} MB" -f $mb)

      - name: Build with PyInstaller
        env:
          PYTHONPATH: .
        run: pyinstaller --clean --noconfirm finance_ranker.spec

      - name: Check the window layer shipped
        shell: pwsh
        env:
          FR_DATA_DIR: ${{ runner.temp }}\frdata-selftest
        run: |
          # --no-window never touches the window layer, which is exactly how a
          # build with no browser in it could reach users unnoticed. --selftest
          # asserts the bundled browser is really there.
          $exe = "dist\FinanceRanker\FinanceRanker.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru -Wait
          $log = Join-Path $env:FR_DATA_DIR "launcher.log"
          if (Test-Path $log) { Get-Content $log }
          if ($proc.ExitCode -ne 0) { throw "selftest failed (exit $($proc.ExitCode))" }
          Write-Host "window layer present"

      - name: Smoke-test the packaged app
        shell: pwsh
        env:
          FR_DATA_DIR: ${{ runner.temp }}\frdata
          FR_SCHEDULE_HOURS: "0"
        run: |
          # Start windowed=no so the runner has no display; the server must come
          # up and answer, which proves the bundle (incl. the akshare native lib)
          # is intact.
          $exe = "dist\FinanceRanker\FinanceRanker.exe"
          if (-not (Test-Path $exe)) { throw "executable not found at $exe" }
          $log = Join-Path $env:FR_DATA_DIR "launcher.log"
          Remove-Item -Recurse -Force $env:FR_DATA_DIR -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath $exe -ArgumentList "--no-window" -PassThru
          try {
            $port = $null
            # The launcher itself gives up after 120 s, so allow longer here to
            # let its own diagnostic (written to launcher.log) win the race.
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if (Test-Path $log) {
                $m = Select-String -Path $log -Pattern "serving at http://127\.0\.0\.1:(\d+)" |
                     Select-Object -Last 1
                if ($m) { $port = $m.Matches[0].Groups[1].Value; break }
              }
              if ($proc.HasExited) { throw "process exited early (code $($proc.ExitCode))" }
            }
            if (-not $port) { throw "server did not report a port within 180s" }
            Write-Host "server on port $port"

            $health = Invoke-RestMethod "http://127.0.0.1:$port/api/health" -TimeoutSec 60
            if ($health.status -ne "ok") { throw "health check failed: $($health.status)" }
            Write-Host "providers reachable: $($health.probe.reachable -join ', ')"

            # The SPA must actually be served (verifies --add-data worked).
            $page = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 30 -UseBasicParsing
            if ($page.StatusCode -ne 200) { throw "index.html returned $($page.StatusCode)" }
            if ($page.Content -notmatch "FinanceRanker") { throw "index.html looks wrong" }
            Write-Host "smoke test passed"
          } catch {
            # The app is built windowed, so launcher.log is the only place a
            # startup failure is recorded. Always surface it before failing.
            Write-Host "::group::launcher.log ($log)"
            if (Test-Path $log) { Get-Content $log } else { Write-Host "(no launcher.log was written)" }
            $data = Get-ChildItem -Recurse -Force $env:FR_DATA_DIR -ErrorAction SilentlyContinue
            if ($data) { Write-Host "`nFR_DATA_DIR contents:"; $data | Select-Object FullName, Length | Out-String | Write-Host }
            Write-Host "::endgroup::"
            throw
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "windows\installer.iss"
          Get-ChildItem dist\*-setup.exe | Format-Table Name, Length

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: FinanceRanker-windows
          path: dist/FinanceRanker/**
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FinanceRanker-setup
          path: dist/*-setup.exe
          if-no-files-found: error

  # -------------------------------------------------------------------- macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        env:
          PYTHONPATH: .
        run: pyinstaller --clean --noconfirm finance_ranker.spec

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: FinanceRanker-macos
          path: dist/FinanceRanker.app
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  # Artifacts require a GitHub login and expire after 90 days. A release is a
  # stable public download link, so pushing a v* tag publishes the installer.
  # This runs on the runner rather than locally because the installer is ~185 MB
  # and, more importantly, it is built from the very commit being tagged.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FinanceRanker-setup
          path: dist

      - name: Publish the installer
        env:
          GH_TOKEN: ${{ github.token }}
          # `gh` needs a repository to talk to. This job does not touch the
          # source, so without the checkout it has no git remote to infer it
          # from ("fatal: not a git repository"); GH_REPO makes that explicit
          # rather than relying on the clone.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --title "FinanceRanker $GITHUB_REF_NAME" \
              --notes "Windows installer. Self-contained: ships its own Chromium, so it needs neither WebView2 nor an existing Edge/Chrome." \
              --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*-setup.exe --clobber
          gh release view "$GITHUB_REF_NAME" --json url,assets \
            --jq '"release: \(.url)", (.assets[] | "  asset: \(.name) (\(.size) bytes)")'
